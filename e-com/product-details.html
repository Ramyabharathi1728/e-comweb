<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Details</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #404040;
    }
    .product-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .product-container img {
      max-width: 300px;
      border-radius: 10px;
    }
    .product-info {
      text-align: center;
      margin-top: 20px;
    }
    .product-info h2 {
      margin-bottom: 10px;
    }
    .product-info p {
      margin: 5px 0;
    }
    .btn {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #1e88e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #0d47a1;
    }
  </style>
</head>
<body>
  <div class="product-container" id="product-details"></div>

  <script>
    // Retrieve product ID from query string
    const urlParams = new URLSearchParams(window.location.search);
    const productId = parseInt(urlParams.get("id"));

    // Use your existing products array
    const products = [/* paste your array here */];

    const product = products.find(p => p.id === productId);

    const productDetailsDiv = document.getElementById("product-details");

    if (product) {
      productDetailsDiv.innerHTML = `
        <img src="${product.image}" alt="${product.name}">
        <div class="product-info">
          <h2>${product.name}</h2>
          <p><strong>Category:</strong> ${product.category}</p>
          <p><strong>Price:</strong> $${product.price.toFixed(2)}</p>
          <button class="btn" onclick="addToCart(${product.id})">Add to Cart</button>
        </div>
      `;
    } else {
      productDetailsDiv.innerHTML = "<p>Product not found.</p>";
    }

    function addToCart(id) {
      alert("Product added to cart: " + id);
      // Add your cart logic here
    }
  </script>
</body>
</html>
